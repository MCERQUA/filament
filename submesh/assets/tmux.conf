# Sub-mesh tmux config
set -g mouse on                   # tmux owns all scroll/mouse — no doubling
set -g history-limit 10000        # scrollback buffer per pane
set -g default-terminal "xterm-256color"
set -g terminal-overrides ",xterm-256color:Tc"

# Remove the delay after Escape (makes Claude Code feel snappier)
set -s escape-time 0

# Status bar — shows agent names across the bottom
set -g status on
set -g status-style "bg=#0f1923,fg=#4a9eff"
set -g status-left "#[fg=#00d4aa,bold] SUB-MESH #[fg=#4a9eff]| "
set -g status-right "#[fg=#6b7a8d]%H:%M "
set -g window-status-current-style "fg=#00d4aa,bold"
set -g pane-border-style "fg=#1e3a5f"
set -g pane-active-border-style "fg=#00d4aa"
